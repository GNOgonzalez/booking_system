name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile so CI catches version-specific breakage.
          python-version: '3.14'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py test
      - run: ruff check scheduling progress integrations config
      # Catch missing production hardening before it reaches Render. Runs with a
      # throwaway key and DEBUG off so the deploy checks actually apply.
      - name: Deployment checks
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-only-throwaway-key-7Kq2xVn9pLmB4wRt6ZhJd3YcFs8QaE5uGvNbXi

          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
