# Nightly demo reset. Render Free has no cron, so GitHub Actions runs it.
# Requires secrets: DATABASE_URL, SECRET_KEY
# Set repository variable USE_GITHUB_DEMO_RESET=true to enable.
#
# This only touches the database. Homework files live on Render's ephemeral disk
# and are purged on container start instead (see scripts/start.sh).

name: Reset demo sandbox

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    if: ${{ vars.USE_GITHUB_DEMO_RESET == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Reset demo data
        env:
          DEBUG: 'False'
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py bootstrap_sandbox --demo --reset --showcase
