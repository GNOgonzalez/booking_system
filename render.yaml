# Render Blueprint — booking API + React static site (Postgres on Supabase)

services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Liveness only. /readyz also checks the database — do not use it here, or a
    # paused Supabase Free project would make Render restart the service.
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      # Free tier is 512 MB RAM; 2 workers x 4 threads fits with headroom.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: "INFO"
      # Optional error tracking — leave unset to keep Sentry inert.
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: SEED_SHOWCASE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "false"

  - type: web
    name: booking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "24"
