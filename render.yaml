# Render Blueprint — booking API + React static site (Postgres on Supabase)

services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/branding/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: SEED_SHOWCASE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "false"

  - type: web
    name: booking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: NODE_VERSION
        value: "24"
